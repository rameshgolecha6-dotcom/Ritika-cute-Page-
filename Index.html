<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Ritika ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f5);
      overflow: hidden;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 25px;
      animation: float 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 35px 22px;
      text-align: center;
      background: rgba(255,255,255,0.85);
      border-radius: 30px;
      box-shadow: 0 15px 40px rgba(255, 105, 150, 0.25);
      position: relative;
      z-index: 2;
    }

    .cute {
      font-size: 90px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      color: #ff4f81;
      font-size: 29px;
      margin: 15px 0;
    }

    .shayari {
      color: #444;
      font-size: 18px;
      line-height: 1.7;
      margin: 20px 0;
    }

    .question {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 14px 32px;
      margin: 12px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yes {
      background: #ff7198;
      color: white;
    }

    #no {
      background: #ffb3c7;
      color: white;
      position: relative;
    }

    button:hover {
      transform: scale(1.08);
    }

    #result {
      display: none;
      margin-top: 20px;
      color: #ff4f81;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="hearts">
    <div class="heart" style="left:10%; animation-delay:0s;">❤️</div>
    <div class="heart" style="left:30%; animation-delay:2s;">💕</div>
    <div class="heart" style="left:50%; animation-delay:1s;">💗</div>
    <div class="heart" style="left:70%; animation-delay:3s;">💖</div>
    <div class="heart" style="left:90%; animation-delay:1.5s;">❤️</div>
  </div>

  <div class="card">

    <div class="cute">🥺💗</div>

    <h1>For You, Ritika ❤️</h1>

    <div class="shayari">
      “Chaand bhi feeka sa lagta hai,<br>
      jab tera chehra yaad aata hai… 🌙❤️<br><br>

      Teri ek smile ke aage,<br>
      mera har din khoobsurat ban jaata hai. 🥺✨”
    </div>

    <div class="question">
      Ek baat puchu? 🥺💗
    </div>

    <button id="yes" onclick="yesClick()">Yes 💕</button>
    <button id="no" onmouseover="moveNo()">No 🙈</button>

    <div id="result">
      Hehe… mujhe pata tha 😭❤️<br>
      You are really special! 🫶✨
    </div>

  </div>

  <script>

    function yesClick() {
      document.getElementById("result").style.display = "block";
    }

    function moveNo() {
      const button = document.getElementById("no");

      const x = Math.random() * 200 - 100;
      const y = Math.random() * 150 - 75;

      button.style.transform =
        `translate(${x}px, ${y}px)`;
    }

  </script>

</body>
</html>
